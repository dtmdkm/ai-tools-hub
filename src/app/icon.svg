<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Beveled Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Glowing Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="12" opacity="0.9"/>

  <!-- AI Text -->
  <!-- 3D Extrusion Shadows -->
  <text x="256" y="350" font-family="Arial, 'Inter', sans-serif" font-size="280" font-weight="900" font-style="italic" text-anchor="middle" fill="#1C053A" transform="translate(12, 18)">Ai</text>
  <text x="256" y="350" font-family="Arial, 'Inter', sans-serif" font-size="280" font-weight="900" font-style="italic" text-anchor="middle" fill="#3D107A" transform="translate(6, 9)">Ai</text>
  
  <!-- Main Face -->
  <text x="256" y="350" font-family="Arial, 'Inter', sans-serif" font-size="280" font-weight="900" font-style="italic" text-anchor="middle" fill="url(#textGrad)">Ai</text>
  
  <!-- Rim Light -->
  <text x="256" y="350" font-family="Arial, 'Inter', sans-serif" font-size="280" font-weight="900" font-style="italic" text-anchor="middle" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.7">Ai</text>

  <defs>
    <!-- Background Gradient (Subtle Dark Space) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1A24" />
      <stop offset="1" stop-color="#050505" />
    </linearGradient>

    <!-- Border Gradient (Neon Purple/Pink) -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A259FF" />
      <stop offset="0.5" stop-color="#FF4E8D" />
      <stop offset="1" stop-color="#FF8E53" />
    </linearGradient>

    <!-- Text Gradient (Platinum White to Purple) -->
    <linearGradient id="textGrad" x1="256" y1="100" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="0.5" stop-color="#E2D1F9" />
      <stop offset="1" stop-color="#A259FF" />
    </linearGradient>
  </defs>
</svg>
